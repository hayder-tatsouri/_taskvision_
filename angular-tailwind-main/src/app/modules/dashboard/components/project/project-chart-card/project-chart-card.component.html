<div class="bg-background flex-col rounded-lg px-8 py-8 sm:flex-row">
  <!-- Card Header -->
  <div class="mb-2 flex items-center justify-between">
    <div class="flex-col">
      <div class="flex items-center space-x-1">
        <span class="text-muted-foreground text-lg font-semibold">Total</span>
        <span class="text-foreground text-4xl font-semibold">{{ totalProjects }}</span>

        <div
          class="flex items-center rounded-md bg-green-500/25 py-1 pr-2 pl-1 text-xs font-semibold"
          [ngClass]="{
            'text-green-500': lastChange > 0,
            'text-rose-600': lastChange < 0
          }"
        >
          <svg-icon
            *ngIf="lastChange > 0"
            src="assets/icons/heroicons/outline/arrow-sm-up.svg"
            [svgClass]="'h-4 w-4'"
          ></svg-icon>
          <svg-icon
            *ngIf="lastChange < 0"
            src="assets/icons/heroicons/outline/arrow-sm-down.svg"
            [svgClass]="'h-4 w-4'"
          ></svg-icon>
          {{ lastChange > 0 ? '+' + lastChange : lastChange }}
        </div>
      </div>
      <span class="text-muted-foreground text-sm">Tous les projets</span>
    </div>

    
  </div>

  <!-- Chart -->
  <apx-chart
    [series]="chartOptions.series!"
    [chart]="chartOptions.chart!"
    [stroke]="chartOptions.stroke!"
    [xaxis]="chartOptions.xaxis!"
    [tooltip]="chartOptions.tooltip!"
    [colors]="chartOptions.colors!"
    [dataLabels]="chartOptions.dataLabels!"
  ></apx-chart>

  <!-- Tableau Mois / Projets / Changement -->
  <table class="mt-4 w-full table-auto text-sm border-collapse border border-gray-200">
    <thead class="bg-gray-100">
      <tr>
        <th class="px-4 py-2 border border-gray-200">Mois</th>
        <th class="px-4 py-2 border border-gray-200">Projets</th>
        <th class="px-4 py-2 border border-gray-200">Changement</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of projects">
        <td class="px-4 py-2 text-center border border-gray-200">{{ item.time }}</td>
        <td class="px-4 py-2 text-center border border-gray-200">{{ item.value }}</td>
        <td class="px-4 py-2 text-center border border-gray-200">
          <span
            [ngClass]="{
              'text-green-600 font-semibold': item.change > 0,
              'text-red-600 font-semibold': item.change < 0,
              'text-gray-500': item.change === 0
            }"
          >
            {{ item.change > 0 ? '+' + item.change : item.change }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
