<ng-container>
  <td class="text-center">
    <input
      [(ngModel)]="user.selected"
      class="checkbox checkbox-sm"
      data-datatable-row-check="true"
      type="checkbox"
      value="28" />
  </td>
  <td>
    <div class="flex items-center gap-2.5">
      <img
        alt="user avatar"
        class="h-9 w-9 shrink-0 rounded-full"
        src="https://ui-avatars.com/api/?name={{ user.firstName }} {{user.lastName}}&background=random" />
      <div class="flex flex-col items-start">
        <a class="text-foreground hover:text-primary text-sm font-semibold">
          {{ user.firstName }} {{user.lastName}}
        </a>
        <a class="text-muted-foreground/70 hover:text-primary text-xs font-medium">
          {{ user.email }}
        </a>
      </div>
    </div>
  </td>
  <td>{{ user.firstName }} {{ user.lastName }}</td>
  <td class="space-x-1">
    <span class="rounded-[30px] bg-yellow-500/10 px-2 py-0.5 text-xs font-medium text-yellow-800">
      {{ user.role }}
    </span>
  </td>

  <td class="text-center flex justify-center gap-1">
    
    <!-- Supprimer Button -->
    <button
      (click)="deleteUser(user.id)"
      class="text-red-600 hover:bg-red-100 hover:text-red-700 flex h-7 px-2 items-center justify-center rounded-md text-xs font-semibold">
      Supprimer
    </button>
  </td>
</ng-container>
